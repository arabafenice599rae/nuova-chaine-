[workspace]
# Il programma on-chain è un crate a sé: toolchain SBF e lockfile propri.
members = ["node"]
exclude = ["programs/timelock"]

[package]
name = "centrifuga"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Chain SVM a validatore unico: chi costruisce il blocco è chi lo firma."

[dependencies]
# Il nodo: esecuzione, journal, snapshot, RPC e stream.
centrifuga-node = { path = "node" }
solana-address = { version = "~2.7", features = ["curve25519"] }
solana-keypair = "3.1.2"
solana-instruction = "~3.5"
solana-message = "4.6"
solana-sdk-ids = "3.1"
solana-signature = { version = "~3.5.2", features = ["verify"] }
solana-signer = "3.0.1"
solana-system-interface = { version = "3.3", features = ["bincode"] }
solana-transaction = { version = "4.3", features = ["wincode", "verify"] }
wincode = "0.6"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
serde_json = "1"
base64 = "0.22"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
webpki-roots = "=1.0.11"

[dev-dependencies]
litesvm = { version = "=0.18.2", features = ["persistence-internal", "precompiles"] }
solana-account = "4.7"
solana-hash = "~4.6"
solana-nonce = { version = "~3.3", features = ["wincode"] }
centrifuga-timelock = { path = "programs/timelock" }
tokio-tungstenite = "0.30.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
bs58 = "0.5"
solana-loader-v3-interface = { version = "8.1", features = ["wincode"] }
sparse-merkle-tree = { version = "=0.6.1", features = ["trie"] }
